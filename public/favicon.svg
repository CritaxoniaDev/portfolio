<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2A4A"/>
      <stop offset="100%" stop-color="#2F3C7E"/>
    </linearGradient>
    <linearGradient id="gGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>

  <!-- accent ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#B8001F" stroke-width="6" opacity="0.85"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25"/>

  <!-- letter G -->
  <text x="200" y="200"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="260"
        font-weight="700"
        fill="url(#gGrad)"
        text-anchor="middle"
        dominant-baseline="central">G</text>

  <!-- accent dot -->
  <circle cx="296" cy="296" r="10" fill="#B8001F"/>
</svg>
